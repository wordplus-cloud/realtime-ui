# The release of an npm package (@wordplus/realtime, @wordplus/realtime-ui): a tag vX.Y.Z, pushed by WordPlus's publish script with the release's files, is
# tested, built and published to npm with provenance, through npm's trusted publishing (no token: npm trusts this
# repository's release.yml in the environment `release`), then made the GitHub release with the package's tarball.
# npm trusts a workflow only for a package it has, so the first version is published by hand from the same files
# (WordPlus's publish script says how); a version npm has already is left as it is.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1

      - name: The tag is the package's version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: npm
        run: |
          name="$(node -p "require('./package.json').name")"
          if [ -n "$(npm view "$name@${GITHUB_REF_NAME#v}" version 2>/dev/null)" ]; then
            echo "$name ${GITHUB_REF_NAME#v} is on npm already."
          else
            npm publish --provenance --access public
          fi

      - name: The GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm pack
          gh release create "$GITHUB_REF_NAME" ./*.tgz --title "$GITHUB_REF_NAME" --notes "$(node -p "require('./package.json').name") ${GITHUB_REF_NAME#v}"
